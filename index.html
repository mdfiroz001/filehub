    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #e0e7ff;
            --primary-glow: rgba(79, 70, 229, 0.5);
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --nav-height: 60px;
            --unread-bg: #fee2e2;
            --unread-border: #fca5a5;
            --chat-user-bg: #4f46e5;
            --chat-user-text: #ffffff;
            --chat-ai-bg: #f1f5f9;
            --chat-ai-text: #0f172a;
            --skeleton-base: #e2e8f0;
            --skeleton-highlight: #f1f5f9;
        }

        [data-theme="dark"] {
            --primary: #818cf8;
            --primary-soft: #1e293b;
            --primary-glow: rgba(129, 140, 248, 0.5);
            --bg: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --unread-bg: #450a0a;
            --unread-border: #7f1d1d;
            --chat-user-bg: #818cf8;
            --chat-user-text: #0f172a;
            --chat-ai-bg: #334155;
            --chat-ai-text: #f8fafc;
            --skeleton-base: #1e293b;
            --skeleton-highlight: #334155;
        }

        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        input, textarea, .profile-avatar, .brand-img, .ai-avatar, .ai-loading-img, .prompt-text-box, .detail-desc, .notif-detail-content {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        body { 
            background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; -webkit-font-smoothing: antialiased; 
            overflow-x: hidden; padding-bottom: calc(var(--nav-height) + 30px);
            transition: background 0.3s ease, color 0.3s ease;
            touch-action: pan-x pan-y;
        }

        .markdown-body img, .detail-desc img {
            max-width: 100%; height: auto; border-radius: 12px;
            display: block; margin: 20px auto; box-shadow: var(--shadow-sm);
        }

        .scrolling-notice-container {
            background: var(--primary); color: #ffffff;
            padding: 8px 16px; font-size: 0.9rem; font-weight: 500;
            display: flex; align-items: center; overflow: hidden;
            border-radius: 12px; margin-bottom: 15px;
            box-shadow: var(--shadow-md); position: relative; z-index: 10;
        }
        .scrolling-notice-container i {
            margin-right: 10px; font-size: 1rem;
            flex-shrink: 0; color: #facc15;
        }

        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .skeleton {
            background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px;
        }
        .sk-img { width: 100%; aspect-ratio: 16/9; border-radius: 12px; margin-bottom: 10px; }
        .sk-title { height: 20px; width: 80%; margin-bottom: 8px; }
        .sk-text { height: 14px; width: 60%; }
        
        header { 
            background: var(--surface); border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 1000; height: 65px; display: flex; align-items: center;
        }
        .header-content { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; height: 100%; display: flex; align-items: center; }
        .header-main { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; cursor: pointer; }
        .brand-img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--surface); box-shadow: 0 0 0 2px var(--primary-soft); }
        .brand-text { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text-main); }

        .header-actions { display: flex; align-items: center; gap: 4px; }
        .icon-btn { background: transparent; border: none; padding: 8px; border-radius: 50%; color: var(--text-sub); display: flex; cursor: pointer; transition: 0.2s; align-items: center; justify-content: center; position: relative; }
        .icon-btn:hover { background: var(--bg); color: var(--text-main); }
        .icon-btn svg { width: 22px; height: 22px; }
        .ai-icon-img { width: 26px; height: 26px; border-radius: 50%; object-fit: contain; }
        
        .notif-badge {
            position: absolute; top: 5px; right: 5px;
            background: #ef4444; color: white;
            font-size: 0.65rem; font-weight: 700;
            width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--surface); display: none;
        }
        .notif-badge.active { display: flex; }

        .search-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--surface); display: flex; align-items: center; padding: 0 15px; transform: scaleX(0); transform-origin: right; transition: transform 0.3s; z-index: 10; box-sizing: border-box; }
        .search-overlay.active { transform: scaleX(1); }
        .search-box-wrapper { flex: 1; display: flex; align-items: center; height: 40px; border: 1.5px solid var(--border); border-radius: 50px; background: var(--bg); padding: 0 5px; }
        .search-input { flex: 1; border: none; background: transparent; padding: 0 5px; color: var(--text-main); outline: none; }
        .search-back-btn, .search-clear-btn { background: none; border: none; color: var(--text-sub); width: 35px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .search-clear-btn { visibility: hidden; } .search-clear-btn.visible { visibility: visible; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .bottom-sheet-overlay.active { opacity: 1; visibility: visible; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100%; height: 80vh; max-height: 95vh; background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.2); z-index: 2001; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.4s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; }
        .bottom-sheet.active { transform: translateY(0); }
        .bottom-sheet.expanded { height: 100% !important; max-height: 100% !important; border-radius: 0; }
        
        .sheet-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; flex-shrink: 0; }
        .sheet-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.2rem; text-align: center; justify-self: center; }
        .sheet-btn { background: none; border: none; cursor: pointer; color: var(--text-sub); padding: 5px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .sheet-btn:hover { background: var(--bg); color: var(--text-main); }
        .sheet-body { flex: 1; overflow-y: auto; padding: 0; position: relative; display: flex; flex-direction: column; }

        .view-container { width: 100%; height: 100%; animation: fadeIn 0.3s ease; }
        .notif-list { list-style: none; padding: 0; margin: 0; }
        .notif-item { padding: 15px 20px; border-bottom: 1px solid var(--bg); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 5px; }
        .notif-item:hover { background: var(--bg); }
        .notif-item.unread { background: var(--unread-bg); border-left: 4px solid var(--unread-border); }
        .notif-title-list { font-weight: 600; font-size: 0.95rem; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .notif-time { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }
        .notif-detail-view { padding: 25px 20px; display: none; }
        .notif-detail-title { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; line-height: 1.3; }
        .notif-detail-time { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 20px; display: block; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .notif-detail-content { line-height: 1.6; color: var(--text-main); font-size: 0.95rem; }

        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: var(--bg); min-height: 0; }
        .chat-bubble { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; position: relative; word-wrap: break-word; animation: fadeIn 0.2s ease; }
        .chat-bubble.user { align-self: flex-end; background: var(--chat-user-bg); color: var(--chat-user-text); border-bottom-right-radius: 2px; }
        .chat-bubble.ai { align-self: flex-start; background: var(--chat-ai-bg); color: var(--chat-ai-text); border-bottom-left-radius: 2px; display: flex; gap: 10px; max-width: 90%; }
        .ai-avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; object-fit: contain; background: white; border: 1px solid var(--border); }
        .ai-content { flex: 1; overflow-x: hidden; min-width: 0; }
        .chat-bubble pre { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; overflow-x: auto; }
        .chat-bubble code { font-family: monospace; font-size: 0.9em; }
        .chat-bubble.ai code { color: #d63384; background: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 4px; }
        .chat-bubble.ai pre code { color: inherit; background: transparent; padding: 0; }
        [data-theme="dark"] .chat-bubble.ai code { color: #f472b6; background: rgba(255,255,255,0.1); }
        .chat-footer { padding: 10px 15px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: flex-end; gap: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); flex-shrink: 0; }
        .chat-input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 10px 15px; max-height: 100px; overflow-y: auto; color: var(--text-main); font-family: inherit; font-size: 1rem; resize: none; outline: none; transition: border-color 0.2s; }
        .chat-input:focus { border-color: var(--primary); }
        .chat-send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .chat-send-btn:hover { opacity: 0.9; transform: scale(1.05); }
        .chat-send-btn svg { width: 20px; height: 20px; fill: white; margin-left: -2px; }

        .typing-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; align-self: flex-start; }
        .ai-loading-img { width: 30px; height: 30px; border-radius: 50%; object-fit: contain; border: none; animation: spin 2s linear infinite; }
        .typing-dots { display: flex; gap: 4px; align-items: center; height: 30px; }
        .dot { width: 6px; height: 6px; background: var(--text-sub); border-radius: 50%; animation: wave 1.3s linear infinite; }
        .dot:nth-child(2) { animation-delay: -1.1s; }
        .dot:nth-child(3) { animation-delay: -0.9s; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes wave { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        @keyframes fadeIn { from{opacity:0; transform: translateY(10px);} to{opacity:1; transform: translateY(0);} }

        .carousel-wrap { width: 100%; aspect-ratio: 16/9; margin-bottom: 20px; border-radius: 16px; overflow: hidden; position: relative; box-shadow: var(--shadow-md); background: var(--surface); }
        .carousel-inner { display: flex; height: 100%; width: 100%; transition: transform 0.5s ease-out; }
        .slide { min-width: 100%; height: 100%; position: relative; cursor: pointer; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .carousel-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 25px; }
        .dot-c { width: 6px; height: 6px; background: var(--border); border-radius: 50%; transition: 0.3s; }
        .dot-c.active { background: var(--primary); width: 18px; border-radius: 3px; }

        .center-eye { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.8); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; color: white; }
        .center-eye svg { width: 40px; height: 40px; stroke-width: 2.5; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .slide:hover .center-eye { opacity: 1; transform: translate(-50%,-50%) scale(1); }
        .slide-overlay { position: absolute; bottom: 0; width: 100%; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); color: white; opacity: 0; transform: translateY(10px); transition: 0.3s; display: flex; justify-content: space-between; align-items: flex-end; box-sizing: border-box; }
        .slide:hover .slide-overlay { opacity: 1; transform: translateY(0); }
        .slide-title { font-family: 'Outfit', sans-serif; font-size: 1.1rem; margin-bottom: 5px; }
        
        .banner-pill { background: var(--primary-soft); color: var(--primary); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 4px; }
        .banner-pill svg { width: 14px; height: 14px; stroke-width: 2.5; }

        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; margin-top: 10px; }
        .section-header h2 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; margin: 0; color: var(--text-main); }
        .section-icon { color: var(--primary); width: 24px; height: 24px; }

        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .file-card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-sm); overflow: hidden; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; border: 1px solid transparent; position: relative; }
        .file-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--shadow-md); }
        .card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--bg); transition: 0.4s; }
        .file-card:hover .card-thumb { transform: scale(1.05); }
        .card-body { padding: 15px; background: var(--surface); z-index: 1; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 1rem; color: var(--text-main); margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.8em; }
        
        .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-sub); padding-top: 12px; border-top: 1px solid var(--bg); }
        .meta-pill { background: var(--primary-soft); color: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: lowercase; display: flex; align-items: center; gap: 5px; }
        .meta-pill svg { width: 14px; height: 14px; stroke-width: 2.5; }

        /* AI Prompt file badge */
        .prompt-file-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(135deg, #4f46e5, #818cf8);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            z-index: 3;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .detail-wrapper { width: 100%; background: transparent; padding: 0; animation: fadeIn 0.3s ease; }
        .detail-header-block { margin: 20px 0; }
        .detail-title { font-family: 'Outfit', sans-serif; font-size: 1.4rem; color: var(--text-main); line-height: 1.3; margin: 0 0 15px 0; }
        
        .detail-meta-grid { display: grid; grid-template-columns: 1fr auto 1fr; width: 100%; align-items: center; gap: 10px; margin-bottom: 10px; }
        .meta-left { justify-self: start; }
        .meta-center { justify-self: center; }
        .meta-right { justify-self: end; }

        .detail-desc { margin-top: 25px; line-height: 1.8; color: var(--text-main); font-size: 1rem; }
        .detail-desc p { margin-bottom: 15px; }
        .detail-desc h1, .detail-desc h2, .detail-desc h3 { margin-top: 22px; margin-bottom: 10px; color: var(--text-main); line-height: 1.3; }
        .detail-desc h1 { font-size: 1.5rem; }
        .detail-desc h2 { font-size: 1.25rem; }
        .detail-desc h3 { font-size: 1.1rem; }
        .detail-desc ul, .detail-desc ol { padding-left: 25px; margin-bottom: 15px; }
        .detail-desc li { margin-bottom: 6px; }
        .detail-desc blockquote {
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            background: var(--bg);
            border-radius: 0 8px 8px 0;
            margin: 15px 0;
            font-style: italic;
            color: var(--text-sub);
        }
        .detail-desc a { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600;
            border-bottom: 1px dashed var(--primary);
            transition: 0.2s;
        }
        .detail-desc a:hover {
            border-bottom-style: solid;
            background: var(--primary-soft);
            padding: 2px 4px;
            border-radius: 4px;
        }
        .detail-desc code {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.88em;
            color: var(--primary);
            border: 1px solid var(--border);
        }
        .detail-desc pre {
            background: var(--bg);
            padding: 14px;
            border-radius: 10px;
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 15px 0;
        }
        .detail-desc pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text-main);
        }
        .detail-desc hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 25px 0;
        }
        .detail-desc table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .detail-desc table th, .detail-desc table td {
            padding: 10px;
            border: 1px solid var(--border);
            text-align: left;
        }
        .detail-desc table th {
            background: var(--bg);
            font-weight: 700;
        }

        .unlock-inline { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); }
        
        .unlock-actions { display: flex; gap: 10px; align-items: stretch; width: 100%; }

    function formatCount(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'm';
        if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
        return n;
    }

    function truncateExt(ext) {
        if (!ext) return 'file';
        if (ext.length > 5) return ext.substring(0, 5) + '..';
        return ext;
    }

    function timeAgoShort(timestamp) {
        if (!timestamp) return 'recent';
        const seconds = Math.floor((Date.now() - timestamp) / 1000);
        if (seconds < 60) return 'just now';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + 'm ago';
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + 'h ago';
        const days = Math.floor(hours / 24);
        if (days < 30) return days + 'd ago';
        const months = Math.floor(days / 30);
        return months + 'mo ago';
    }

    function escapeHtmlUser(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // ===== PARSE [FILE:ID|Title|Ext] into beautiful cards =====
    function parseFileLinks(text) {
        if (!text) return '';
        const fileRegex = /\[FILE:([^|\]]+)\|([^|\]]+)\|([^\]]+)\]/g;
        let processed = text.replace(fileRegex, (match, id, title, ext) => {
            const cleanId = id.trim();
            const cleanTitle = title.trim();
            const cleanExt = ext.trim();
            const safeTitle = String(cleanTitle).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `\n\n<div class="ai-file-card" data-file-id="${cleanId}" data-file-ext="${cleanExt}"><div class="ai-file-icon">${getExtIcon(cleanExt)}</div><div class="ai-file-info"><div class="ai-file-title">${safeTitle}</div><div class="ai-file-meta"><span class="ai-file-ext">${cleanExt}</span><span class="ai-file-cta">Click to open →</span></div></div></div>\n\n`;
        });
        processed = processed.replace(/\n{3,}/g, '\n\n');
        return processed;
    }

    function getExtIcon(ext) {
        const e = String(ext || '').toLowerCase();
        if (e.includes('apk')) return '📱';
        if (e.includes('zip') || e.includes('rar')) return '📦';
        if (e.includes('pdf')) return '📄';
        if (e.includes('mp4') || e.includes('mkv')) return '🎬';
        if (e.includes('mp3')) return '🎵';
        if (e.includes('jpg') || e.includes('png')) return '🖼️';
        if (e.includes('ai')) return '🎨';
        if (e.includes('exe')) return '💻';
        if (e.includes('doc')) return '📝';
        return '📁';
    }

    function appendMessage(role, text, saveToHistory = true) {
        const div = document.createElement('div'); 
        div.className = `chat-bubble ${role}`;
        
        if (role === 'ai') {
            const processedText = parseFileLinks(text);
            const parsed = DOMPurify.sanitize(marked.parse(processedText), {
                ADD_ATTR: ['data-file-id', 'data-file-ext', 'target']
            });
            const avatarUrl = getAiAvatarUrl(document.documentElement.getAttribute('data-theme'));
            div.innerHTML = `<img src="${avatarUrl}" class="ai-avatar"><div class="ai-content">${parsed}</div>`;
            
            setTimeout(() => {
                div.querySelectorAll('.ai-file-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        e.preventDefault();
                        const fileId = card.dataset.fileId;
                        if (fileId) {
                            closeSheetCommon();
                            setTimeout(() => navigateTo('/file/' + fileId), 350);
                        }
                    });
                });
            }, 50);
        } else {
            div.innerText = text;
        }
        chatList.appendChild(div); 
        scrollToBottom();
        if (role === 'ai' && saveToHistory) hljs.highlightAll();
    }

    async function sendMessage() {
        const text = chatInput.value.trim(); if(!text) return;
        chatInput.value = ''; chatInput.style.height = 'auto';
        appendMessage('user', text); showTypingIndicator();
        
        try {
            if (currentUser) {
                await chatsRef.push({ userId: currentUser.uid, role: 'user', content: text, timestamp: Date.now() });
            }

            const settingsSnap = await settingsRef.once('value');
            const settingsVal = settingsSnap.val() || {};
            const aiSettings = settingsVal.ai || {};
            const apiKey = aiSettings.apiKey || settingsVal.aiApiKey || '';
            const apiUrl = aiSettings.apiURL || "https://api.openai.com/v1/chat/completions";
            const apiModel = aiSettings.model || "gpt-4o-mini";

            if (!apiKey) {
                removeTypingIndicator();
                const noKeyMsg = "⚠️ **AI সিস্টেম অফলাইন:** অ্যাডমিন প্যানেল থেকে AI API Key সেট করা হয়নি।";
                appendMessage('ai', noKeyMsg);
                if (currentUser) await chatsRef.push({ userId: currentUser.uid, role: 'ai', content: noKeyMsg, timestamp: Date.now() });
                return;
            }

            const filesSnap = await filesRef.once('value');
            const filesData = filesSnap.val() || {};
            
            const approvedFilesList = Object.entries(filesData)
                .map(([id, item]) => ({
                    id: id, title: item.title, extension: item.file_extension,
                    status: item.status
                }))
                .filter(f => f.status === 'approved');

            const aiPromptFiles = getAIPromptFiles();
            const allAvailableItems = [
                ...approvedFilesList,
                ...aiPromptFiles.map(p => ({ id: p.id, title: p.title, extension: '.ai', status: 'approved' }))
            ];

            const systemPrompt = `You are FileHub AI, an intelligent assistant for the FileHub website.

DATABASE ACCESS (${allAvailableItems.length} files):
${JSON.stringify(allAvailableItems, null, 2)}

USER: ${currentUserData?.fullname || 'Guest'}

RESPONSE RULES (VERY IMPORTANT):
1. Speak in Bengali (বাংলা) unless user speaks English.
2. When mentioning files, ALWAYS use this EXACT format (one per line, no bullet points, no markdown links):
   [FILE:ID|Title|Extension]

   Example:
   [FILE:earnix-job|EARNRIX JOB|.apk]
   [FILE:ai-prompt-0|🎬 TikTok Cover Photo Mod APK (Premium Unlocked) 🎨|.ai]

3. NEVER use markdown links like [text](url) for files.
4. NEVER use bullet points (- or *) for file lists. Just newlines.
5. Add a short friendly intro line, then list files separated by newlines.
6. End with a helpful question or note.`;

            const apiResponse = await fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                body: JSON.stringify({
                    model: apiModel,
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: text }
                    ],
                    temperature: 0.7
                })
            });

            const responseData = await apiResponse.json();
            removeTypingIndicator();

            if (apiResponse.ok && responseData.choices && responseData.choices.length > 0) {
                const aiReply = responseData.choices[0].message.content;
                appendMessage('ai', aiReply);
                if (currentUser) {
                    await chatsRef.push({ userId: currentUser.uid, role: 'ai', content: aiReply, timestamp: Date.now() });
                }
            } else {
                const errorMsg = responseData.error?.message || responseData.message || `HTTP ${apiResponse.status} Error`;
                appendMessage('ai', `⚠️ **API Error:** ${errorMsg}`);
            }
        } catch (e) { 
            console.error(e);
            removeTypingIndicator(); 
            appendMessage('ai', `⚠️ **Error:** ${e.message || 'নেটওয়ার্ক সমস্যা।'}`); 
        }
    }

    async function handleRoute() {
        let path = '/';
        if (window.location.hash && window.location.hash.startsWith('#/')) {
            path = window.location.hash.substring(1);
        } else if (window.location.pathname && window.location.pathname !== '/' && window.location.pathname !== '/index.html') {
            path = window.location.pathname;
        }
        
        if (currentRoute) path = currentRoute;
        if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
        if (!path || path === '') path = '/';
        if (path.startsWith('/index.html/')) path = path.substring('/index.html'.length);

        clearInterval(bannerInterval); clearInterval(detailInterval);
        await loadData();
        
        if (path === '/' || path === '/index.html' || path === '') {
            resetOGTags(); renderHome();
        } else if (path.startsWith('/file/')) {
            const slug = decodeURIComponent(path.split('/file/')[1]);
            if (slug) renderDetail('file', slug);
            else renderError('Not Found', 'File ID missing.');
        } else if (path.startsWith('/banner/')) {
            const id = path.split('/banner/')[1];
            if (id) renderDetail('banner', id);
            else renderError('Not Found', 'Banner ID missing.');
        } else if (path === '/upload') {
            if (currentUser) renderUpload();
            else { showAuthModal(); renderHome(); }
        } else if (path === '/profile') {
            if (currentUser) renderProfile();
            else { showAuthModal(); renderHome(); }
        } else {
            console.warn('Unknown route:', path);
            renderHome();
        }
    }

    window.addEventListener('popstate', () => { currentRoute = null; handleRoute(); });
    window.addEventListener('hashchange', () => {
        const hashPath = window.location.hash.substring(1);
        if (hashPath) { currentRoute = hashPath; handleRoute(); }
    });

    function updateOGTags(item) {
        const title = item.title || 'FileHub';
        const description = item.description 
            ? item.description.replace(/[#*`_>\[\]()!]/g, '').substring(0, 160)
            : 'Download premium files securely from FileHub.';
        const image = item.thumbnail_url || 'https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png';
        const url = window.location.href;
        document.title = title + ' - FileHub';

        function setMeta(property, content, isName = false) {
            const attr = isName ? 'name' : 'property';
            let meta = document.querySelector(`meta[${attr}="${property}"]`);
            if (!meta) {
                meta = document.createElement('meta');
                meta.setAttribute(attr, property);
                document.head.appendChild(meta);
            }
            meta.setAttribute('content', content);
        }

        setMeta('title', title + ' - FileHub', true);
        setMeta('description', description, true);
        setMeta('og:title', title);
        setMeta('og:description', description);
        setMeta('og:image', image);
        setMeta('og:image:width', '1200');
        setMeta('og:image:height', '630');
        setMeta('og:url', url);
        setMeta('og:type', 'article');
        setMeta('og:site_name', 'FileHub');
        setMeta('twitter:card', 'summary_large_image', true);
        setMeta('twitter:title', title, true);
        setMeta('twitter:description', description, true);
        setMeta('twitter:image', image, true);
        setMeta('og:image:secure_url', image);
    }

    function resetOGTags() {
        document.title = 'FileHub - Secure File Sharing';
        const defaults = {
            'og:title': 'FileHub Premium - Secure Storage & Sharing',
            'og:description': 'Access and manage your premium files with FileHub.',
            'og:image': 'https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png',
            'og:url': 'https://filehub.vercel.app/',
            'og:type': 'website'
        };
        Object.entries(defaults).forEach(([key, val]) => {
            let meta = document.querySelector(`meta[property="${key}"]`);
            if (meta) meta.setAttribute('content', val);
        });
    }

    // Copy main AI prompt
    window.copyMainPrompt = function(btnEl) {
        const promptBox = document.getElementById('promptTextBox');
        if (!promptBox) return;
        
        const promptText = promptBox.textContent;
        const originalHTML = btnEl.innerHTML;
        
        const copyToClipboard = () => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(promptText);
            } else {
                return new Promise((resolve, reject) => {
                    const temp = document.createElement('textarea');
                    temp.value = promptText;
                    temp.style.position = 'fixed';
                    temp.style.opacity = '0';
                    document.body.appendChild(temp);
                    temp.select();
                    try { document.execCommand('copy'); resolve(); }
                    catch (e) { reject(e); }
                    document.body.removeChild(temp);
                });
            }
        };
        
        copyToClipboard().then(() => {
            btnEl.innerHTML = '<i class="fas fa-check"></i> Copied to Clipboard!';
            btnEl.classList.add('copied');
            setTimeout(() => {
                btnEl.innerHTML = originalHTML;
                btnEl.classList.remove('copied');
            }, 2000);
            showCopyToast('✅ Prompt copied! Gemini AI তে পেস্ট করুন');
        }).catch(() => {
            alert('❌ Copy failed. Please copy manually.');
        });
    };

    function showCopyToast(message) {
        const existing = document.getElementById('copyToast');
        if (existing) existing.remove();
        
        const toast = document.createElement('div');
        toast.id = 'copyToast';
        toast.className = 'copy-toast';
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
        document.body.appendChild(toast);
        
        requestAnimationFrame(() => toast.classList.add('show'));
        
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    window.copyPageLink = (btn, link) => {
        navigator.clipboard.writeText(link).then(() => {
            const originalIcon = btn.innerHTML;
            btn.innerHTML = SVG_CHECK; btn.style.borderColor = '#10b981'; btn.style.color = '#10b981';
            setTimeout(() => { btn.innerHTML = originalIcon; btn.style.borderColor = ''; btn.style.color = ''; }, 2000);
        }).catch(() => { document.getElementById('dlStatus').innerText = 'Failed to copy link.'; });
    };

    // ============================================
    // ADSTERRA
    // ============================================
    window.triggerAd = async (fileId, currentWatched, reqAds, type) => {
        adUnlockCompleted = false; adSecondsElapsed = 0; adWindowOpened = false;
        pendingAdFileId = fileId; pendingAdType = type;
        pendingAdCurrentWatched = currentWatched; pendingAdReq = reqAds;

        const activeNetwork = appSettings.ads?.activeNetwork || 'adsterra';
        const adsterraLink = appSettings.ads?.adsterraDirectLink || '';

        let adLink = '';
        if (activeNetwork === 'adsterra' || !activeNetwork || activeNetwork === 'both') {
            adLink = adsterraLink;
        }

        if (!adLink) {
            alert('⚠️ অ্যাডমিন প্যানেল থেকে Adsterra Direct Link সেট করা হয়নি।');
            return;
        }

        const isAI = isAIPromptId(fileId);
        adPopupTitle.textContent = isAI ? `Unlock AI Prompt (Step ${currentWatched + 1} of ${reqAds})` : `Unlock Step ${currentWatched + 1} of ${reqAds}`;
        adPopupText.innerHTML = `আনলক করতে নিচের বাটনে ক্লিক করুন। একটি নতুন ট্যাবে অ্যাড খুলবে। <b>অন্তত ৮ সেকেন্ড</b> অপেক্ষা করুন।`;
        adPopupBtn.disabled = false;
        adPopupBtn.innerHTML = '<i class="fas fa-external-link-alt mr-2"></i> Open Ad & Unlock';
        adPopupStatus.textContent = '';
        adWarning.classList.remove('show');
        adTimerDisplay.style.display = 'none';
        adTimerDisplay.textContent = AD_REQUIRED_SECONDS;
        adProgressBar.style.display = 'none';
        adProgressFill.style.width = '0%';
        adPopup.classList.add('active');
    };

    window.openAdsterraLink = async () => {
        const adsterraLink = appSettings.ads?.adsterraDirectLink || '';
        if (!adsterraLink) { adPopupStatus.textContent = '⚠️ Not configured.'; return; }

        adPopupBtn.disabled = true;
        adPopupBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Ad Opened...';
        adPopupStatus.textContent = 'অ্যাড নতুন ট্যাবে খোলা হয়েছে। ৮ সেকেন্ড অপেক্ষা করুন...';
        adWarning.classList.add('show');

        const adWindow = window.open(adsterraLink, '_blank');
        if (!adWindow || adWindow.closed || typeof adWindow.closed == 'undefined') {
            adPopupStatus.textContent = '⚠️ Popup blocked! Please allow popups.';
            adPopupBtn.disabled = false;
            adPopupBtn.innerHTML = '<i class="fas fa-external-link-alt mr-2"></i> Try Again';
            return;
        }

        adWindowOpened = true; adSecondsElapsed = 0;
        adTimerDisplay.style.display = 'block';
        adTimerDisplay.textContent = AD_REQUIRED_SECONDS;
        adProgressBar.style.display = 'block';
        adProgressFill.style.width = '0%';

        let remaining = AD_REQUIRED_SECONDS;
        adTimerInterval = setInterval(() => {
            remaining--; adSecondsElapsed++;
            if (remaining > 0) {
                adTimerDisplay.textContent = remaining;
                const pct = ((AD_REQUIRED_SECONDS - remaining) / AD_REQUIRED_SECONDS) * 100;
                adProgressFill.style.width = pct + '%';
                adPopupStatus.textContent = `⏳ ${remaining} সেকেন্ড বাকি...`;
            } else {
                adTimerDisplay.textContent = '0';
                adProgressFill.style.width = '100%';
                clearInterval(adTimerInterval);
                adPopupStatus.textContent = '✅ সময় সম্পূর্ণ!';
                completeAdUnlock();
            }
        }, 1000);

        adCheckInterval = setInterval(() => {
            try {
                if (adWindow.closed && !adUnlockCompleted) {
                    clearInterval(adCheckInterval);
                    if (adSecondsElapsed < AD_REQUIRED_SECONDS) {
                        clearInterval(adTimerInterval);
                        adWarning.classList.add('show');
                        adWarning.innerHTML = '<i class="fas fa-exclamation-triangle"></i> আপনি ৮ সেকেন্ডের আগে অ্যাড বন্ধ করেছেন!';
                        adPopupStatus.textContent = '❌ অ্যাড খুব দ্রুত বন্ধ হয়েছে।';
                        adPopupBtn.disabled = false;
                        adPopupBtn.innerHTML = '<i class="fas fa-redo mr-2"></i> Try Again';
                        adTimerDisplay.style.display = 'none';
                        adProgressBar.style.display = 'none';
                        adProgressFill.style.width = '0%';
                        adWindowOpened = false;
                    }
                }
            } catch(e) {}
        }, 500);
    };

    async function completeAdUnlock() {
        if (adUnlockCompleted) return;
        adUnlockCompleted = true;
        if (!pendingAdFileId) return;

        clearInterval(adTimerInterval); clearInterval(adCheckInterval);
        adPopupBtn.disabled = true;
        adPopupBtn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Unlocked!';
        adPopupStatus.textContent = '✅ আনলক হচ্ছে...';
        adWarning.classList.remove('show');

        const newWatchedCount = pendingAdCurrentWatched + 1;
        try {
            if (currentUser) {
                const statusRef = database.ref(`user_file_status/${currentUser.uid}_${pendingAdFileId}`);
                await statusRef.set(newWatchedCount);
                await usersRef.child(currentUser.uid).child('adsWatched').transaction(c => (c || 0) + 1);
            } else {
                localStorage.setItem(`ad_${pendingAdFileId}`, newWatchedCount);
            }
        } catch(e) { console.error(e); }

        setTimeout(() => { closeAdPopup(); handleRoute(); }, 1200);
    }

    window.closeAdPopup = () => {
        if (adWindowOpened && !adUnlockCompleted && adSecondsElapsed < AD_REQUIRED_SECONDS) {
            const confirmClose = confirm('⚠️ আপনি এখনও ৮ সেকেন্ড পূর্ণ করেননি। বন্ধ করলে স্টেপ আবার শুরু করতে হবে।');
            if (!confirmClose) return;
        }
        adPopup.classList.remove('active');
        adProgressBar.style.display = 'none'; adProgressFill.style.width = '0%';
        adTimerDisplay.style.display = 'none'; adWarning.classList.remove('show');
        if (adTimerInterval) clearInterval(adTimerInterval);
        if (adCheckInterval) clearInterval(adCheckInterval);
        adWindowOpened = false; adSecondsElapsed = 0;
        adUnlockCompleted = false; pendingAdFileId = null;
    };

    adPopup.addEventListener('click', (e) => { if (e.target === adPopup) closeAdPopup(); });

    // ============================================
    // CAROUSEL
    // ============================================
    function initCarousel(innerId, dotsId, count, isHome) {
        const inner = document.getElementById(innerId); const dots = document.getElementById(dotsId)?.children;
        if (!inner || !dots) return;
        let idx = 0; let interval;
        function update() { inner.style.transform = `translateX(-${idx * 100}%)`; for(let d of dots) d.classList.remove('active'); dots[idx]?.classList.add('active'); }
        function next() { idx = (idx + 1) % count; update(); }
        function prev() { idx = (idx - 1 + count) % count; update(); }
        function startTimer() { interval = setInterval(next, 5000); if(isHome) bannerInterval = interval; else detailInterval = interval; }
        startTimer();
        let touchStartX = 0; let touchEndX = 0;
        inner.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; clearInterval(interval); }, {passive: true});
        inner.addEventListener('touchend', (e) => { touchEndX = e.changedTouches[0].screenX; if (touchEndX < touchStartX - 50) next(); if (touchEndX > touchStartX + 50) prev(); startTimer(); }, {passive: true});
    }

    // ============================================
    // UPLOAD
    // ============================================
    function renderUpload() {
        document.title = "Upload - FileHub";
        if (!currentUser) { showAuthModal(); return; }

        app.innerHTML = `
            <div class="upload-form">
                <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:24px;">Upload New File</h1>
                <div id="upload-alert" class="alert hidden"></div>
                <form id="upload-form">
                    <div class="form-group"><label class="form-label">Title</label><input type="text" id="upload-title" class="form-control" placeholder="Enter file title" required></div>
                    <div class="form-group"><label class="form-label">Description</label><textarea id="upload-description" class="form-control" rows="4" placeholder="Markdown supported" required></textarea></div>
                    <div class="form-group"><label class="form-label">File Extension</label><input type="text" id="upload-extension" class="form-control" placeholder=".zip" required></div>
                    <div class="form-group"><label class="form-label">Thumbnail URL</label><input type="url" id="upload-thumbnail" class="form-control" required></div>
                    <div class="form-group"><label class="form-label">Download URL</label><input type="url" id="upload-download" class="form-control" required></div>
                    <div class="form-group"><label class="form-label">Detail Photos (comma separated)</label><textarea id="upload-photos" class="form-control" rows="2"></textarea></div>
                    <div class="upload-notice">
                        <i class="fas fa-info-circle"></i>
                        <span><strong>Note:</strong> Your upload will be reviewed by an Admin before it becomes public.</span>
                    </div>
                    <button type="submit" class="btn btn-primary" id="upload-btn" style="margin-top:16px;">
                        <i class="fas fa-upload mr-2"></i> Upload File
                    </button>
                </form>
            </div>
        `;

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('upload-btn');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Uploading...';
            
            const fileData = {
                title: document.getElementById('upload-title').value,
                description: document.getElementById('upload-description').value,
                file_extension: document.getElementById('upload-extension').value,
                thumbnail_url: document.getElementById('upload-thumbnail').value,
                download_url: document.getElementById('upload-download').value,
                required_ads: 0,
                detail_photos: document.getElementById('upload-photos').value.split(',').map(u => u.trim()).filter(u => u),
                status: 'pending',
                created_at: Date.now(),
                total_downloads: 0,
                uploadedBy: currentUser.uid,
                uploadedByEmail: currentUser.email
            };
            
            try {
                await filesRef.push(fileData);
                showAlert('upload-alert', 'File uploaded successfully!', 'success');
                document.getElementById('upload-form').reset();
                setTimeout(() => navigateTo('/profile'), 2000);
            } catch (error) {
                showAlert('upload-alert', error.message, 'error');
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-upload mr-2"></i> Upload File';
            }
        });
    }

    // ============================================
    // PROFILE
    // ============================================
    function renderProfile() {
        document.title = "Profile - FileHub";
        if (!currentUser) { showAuthModal(); return; }

        const userFiles = allFiles.filter(f => f.uploadedBy === currentUser.uid);
        const totalDownloads = userFiles.reduce((sum, f) => sum + (f.total_downloads || 0), 0);
        const approvedFiles = userFiles.filter(f => f.status === 'approved').length;
        const pendingFiles = userFiles.filter(f => f.status === 'pending').length;
        const rejectedFiles = userFiles.filter(f => f.status === 'rejected').length;

        let adsWatched = currentUserData?.adsWatched || 0;
        const joinDate = currentUser.metadata?.creationTime ? new Date(currentUser.metadata.creationTime) : new Date();
        const formattedJoinDate = `${joinDate.getMonth()+1}/${joinDate.getDate()}/${joinDate.getFullYear()}`;

        const username = currentUserData?.username || 'username';
        const fullname = currentUserData?.fullname || currentUser.displayName || 'User';
        const avatar = currentUserData?.avatar || 'https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png';
        const isActive = currentUserData?.isAccountActive !== false;
        const displayId = currentUserData?.numericId || currentUser.uid.substring(0,10);

        app.innerHTML = `
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar-wrapper">
                        <img src="${avatar}" class="profile-avatar" id="profileAvatar" onclick="openLightbox(this.src)" onerror="this.src='https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png'">
                        <div class="profile-avatar-edit" onclick="editAvatar()"><i class="fas fa-camera"></i></div>
                    </div>
                    <div class="profile-info">
                        <h1 class="profile-name">${escapeHtmlUser(fullname)}</h1>
                        <div class="profile-username"><i class="fas fa-at"></i> ${escapeHtmlUser(username)}</div>
                        <div class="profile-id"><i class="fas fa-id-badge"></i> ID: ${displayId}</div>
                        <div class="profile-badges">
                            <span class="badge ${isActive ? 'badge-active' : 'badge-inactive'}">
                                <i class="fas ${isActive ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                                ${isActive ? 'Active' : 'Inactive'}
                            </span>
                        </div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-download"></i></div><div class="stat-content"><div class="stat-value">${totalDownloads}</div><div class="stat-label">Downloads</div></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-cloud-upload-alt"></i></div><div class="stat-content"><div class="stat-value">${userFiles.length}</div><div class="stat-label">Uploads</div></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-eye"></i></div><div class="stat-content"><div class="stat-value">${adsWatched}</div><div class="stat-label">Ads Watched</div></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar-alt"></i></div><div class="stat-content"><div class="stat-value">${formattedJoinDate}</div><div class="stat-label">Joined</div></div></div>
                </div>

                <div class="profile-actions">
                    <button class="action-btn" onclick="openEditProfileModal()"><i class="fas fa-user-edit"></i> Edit Profile</button>
                    <button class="action-btn" onclick="openChangePasswordModal()"><i class="fas fa-key"></i> Change Password</button>
                    <button class="action-btn danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>

                <div class="uploads-section">
                    <div class="uploads-header">
                        <h2 class="uploads-title"><i class="fas fa-cloud-upload-alt" style="color: var(--primary);"></i> Your Uploads</h2>
                        <div class="upload-stats">
                            <div class="upload-stat"><div class="upload-stat-value">${approvedFiles}</div><div class="upload-stat-label">Approved</div></div>
                            <div class="upload-stat"><div class="upload-stat-value" style="color:#f59e0b">${pendingFiles}</div><div class="upload-stat-label">Pending</div></div>
                            <div class="upload-stat"><div class="upload-stat-value" style="color:#ef4444">${rejectedFiles}</div><div class="upload-stat-label">Rejected</div></div>
                        </div>
                    </div>

                    <div class="file-grid">
                        ${userFiles.length > 0 ? userFiles.map(f => {
                            let statusClass = f.status === 'approved' ? 'status-approved' : f.status === 'pending' ? 'status-pending' : 'status-rejected';
                            let statusIcon = f.status === 'approved' ? '<i class="fas fa-check-circle"></i>' : f.status === 'pending' ? '<i class="fas fa-clock"></i>' : '<i class="fas fa-times-circle"></i>';
                            
                            return `
                                <div class="file-card" onclick="navigateTo('/file/${f.id}')">
                                    <img src="${f.thumbnail_url || ''}" class="card-thumb" onerror="this.onerror=null;this.src='https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png'">
                                    <div class="card-body">
                                        <div class="card-title">${escapeHtmlUser(f.title || 'Untitled')}</div>
                                        <div class="card-footer">
                                            <span class="status-badge ${statusClass}">${statusIcon} ${f.status || 'pending'}</span>
                                            <span class="meta-pill"><i class="fas fa-download"></i> ${f.total_downloads || 0}</span>
                                        </div>
                                    </div>
                                </div>`;
                        }).join('') : `
                            <div class="no-uploads">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>No files uploaded yet.</p>
                                <button class="btn btn-primary" onclick="navigateTo('/upload')"><i class="fas fa-upload"></i> Upload Now</button>
                            </div>
                        `}
                    </div>
                </div>
            </div>
        `;
    }

    window.openEditProfileModal = () => {
        document.getElementById('editProfileModalContent').innerHTML = `
            <h2 class="modal-title">Edit Profile</h2>
            <div id="editProfileAlert" class="alert hidden"></div>
            <form id="editProfileForm">
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="editFullName" class="form-control" value="${escapeHtmlUser(currentUserData?.fullname || '')}" required></div>
                <div class="form-group"><label class="form-label">Username</label><input type="text" id="editUsername" class="form-control" value="${escapeHtmlUser(currentUserData?.username || '')}" required></div>
                <div class="form-group"><label class="form-label">Avatar URL</label><input type="url" id="editAvatar" class="form-control" value="${escapeHtmlUser(currentUserData?.avatar || '')}"></div>
                <button type="submit" class="btn btn-primary" id="editProfileBtn"><i class="fas fa-save mr-2"></i> Save Changes</button>
            </form>
        `;
        document.getElementById('editProfileForm').addEventListener('submit', saveProfileChanges);
        openModal('editProfileModal');
    };

    async function saveProfileChanges(e) {
        e.preventDefault();
        const btn = document.getElementById('editProfileBtn');
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';
        
        const updates = {
            fullname: document.getElementById('editFullName').value,
            username: document.getElementById('editUsername').value,
            avatar: document.getElementById('editAvatar').value
        };
        
        try {
            await usersRef.child(currentUser.uid).update(updates);
            currentUserData = { ...currentUserData, ...updates };
            showModalAlert('editProfileAlert', 'Profile updated!', 'success');
            setTimeout(() => { closeModal('editProfileModal'); renderProfile(); }, 1500);
        } catch (error) {
            showModalAlert('editProfileAlert', error.message, 'error');
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Changes';
        }
    }

    window.openChangePasswordModal = () => {
        document.getElementById('changePasswordModalContent').innerHTML = `
            <h2 class="modal-title">Change Password</h2>
            <div id="changePasswordAlert" class="alert hidden"></div>
            <form id="changePasswordForm">
                <div class="form-group"><label class="form-label">Current Password</label><input type="password" id="currentPassword" class="form-control" required></div>
                <div class="form-group"><label class="form-label">New Password</label><input type="password" id="newPassword" class="form-control" required></div>
                <div class="form-group"><label class="form-label">Confirm New Password</label><input type="password" id="confirmPassword" class="form-control" required></div>
                <button type="submit" class="btn btn-primary" id="changePasswordBtn"><i class="fas fa-key mr-2"></i> Update Password</button>
            </form>
        `;
        document.getElementById('changePasswordForm').addEventListener('submit', changePassword);
        openModal('changePasswordModal');
    };

    async function changePassword(e) {
        e.preventDefault();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('changePasswordBtn');
        
        if (newPassword !== confirmPassword) { showModalAlert('changePasswordAlert', 'Passwords do not match!', 'error'); return; }
        if (newPassword.length < 6) { showModalAlert('changePasswordAlert', 'Password must be 6+ characters!', 'error'); return; }
        
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Updating...';
        
        try {
            const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, currentPassword);
            await currentUser.reauthenticateWithCredential(credential);
            await currentUser.updatePassword(newPassword);
            showModalAlert('changePasswordAlert', 'Password changed!', 'success');
            setTimeout(() => { closeModal('changePasswordModal'); }, 1500);
        } catch (error) {
            showModalAlert('changePasswordAlert', error.message, 'error');
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-key mr-2"></i> Update Password';
        }
    }

    window.editAvatar = () => openEditProfileModal();
    window.logout = async () => { await auth.signOut(); navigateTo('/'); };

    function showAlert(elementId, message, type = 'success') {
        const alert = document.getElementById(elementId);
        if (alert) {
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.classList.remove('hidden');
            setTimeout(() => alert.classList.add('hidden'), 3000);
        }
    }
    function showModalAlert(elementId, message, type = 'success') {
        const alert = document.getElementById(elementId);
        if (alert) { alert.textContent = message; alert.className = `alert alert-${type}`; alert.classList.remove('hidden'); }
    }

    chatInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });

    // ============================================
    // INIT
    // ============================================
    initTheme();
    currentRoute = window.location.pathname || '/';
    if (window.location.hash && window.location.hash.startsWith('#/')) {
        currentRoute = window.location.hash.substring(1);
    }

    setTimeout(() => {
        if (!app.innerHTML || app.innerHTML.trim() === '') {
            handleRoute();
        }
    }, 100);
</script>
